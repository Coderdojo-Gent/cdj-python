<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" font-family="Arial, Helvetica, sans-serif">
  <defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <polygon points="170,40 290,95 170,150 50,95" fill="#fff3dd" stroke="#f5a623" stroke-width="3"/>
  <text x="170" y="101" text-anchor="middle" font-size="17" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">levens &gt; 0 ?</text>
  <line x1="290" y1="95" x2="356" y2="95" stroke="#555" stroke-width="2.5" marker-end="url(#pijl)"/>
  <text x="304" y="86" font-size="15" font-weight="bold" fill="#3c9d3c">ja</text>
  <rect x="360" y="66" width="225" height="58" rx="8" fill="#e8f6e8" stroke="#3c9d3c" stroke-width="2.5"/>
  <text x="472" y="89" text-anchor="middle" font-size="15" font-weight="bold">doe het blok</text>
  <text x="472" y="112" text-anchor="middle" font-size="14" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">levens = levens - 1</text>
  <polyline points="472,66 472,18 170,18 170,36" fill="none" stroke="#555" stroke-width="2.5" marker-end="url(#pijl)"/>
  <text x="321" y="13" text-anchor="middle" font-size="13" fill="#555">en dan opnieuw kijken</text>
  <line x1="170" y1="150" x2="170" y2="166" stroke="#555" stroke-width="2.5" marker-end="url(#pijl)"/>
  <text x="182" y="163" font-size="15" font-weight="bold" fill="#d9534f">nee</text>
  <rect x="85" y="168" width="170" height="28" rx="6" fill="#fdecec" stroke="#d9534f" stroke-width="2"/>
  <text x="170" y="187" text-anchor="middle" font-size="14">verder na de lus</text>
</svg>
